<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পাসওয়ার্ড সুরক্ষিত সেফলিংক</title>
    <!-- Tailwind CSS CDN for modern aesthetics -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ফন্ট হিসেবে Inter ব্যবহার করা হয়েছে */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        .container-box {
            background-color: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 0 10px rgba(0, 0, 0, 0.05);
            max-width: 90%;
            margin: 1rem auto;
        }
        .input-style {
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            width: 100%;
            transition: all 0.2s;
        }
        .input-style:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="container-box w-full max-w-lg">
        <h1 class="text-3xl font-extrabold text-gray-900 mb-6 text-center border-b pb-3">
            🔐 সেফলিংক টুল (নো ডেটাবেস)
        </h1>

        <!-- Loader/Message Area -->
        <div id="message-box" class="hidden p-4 mb-4 rounded-lg text-sm font-medium text-center" role="alert"></div>

        <!-- Section 1: Link Creator -->
        <div id="creator-section">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">নতুন সেফলিংক তৈরি করুন</h2>

            <div class="mb-4">
                <label for="target-url" class="block text-sm font-medium text-gray-700 mb-2">গন্তব্য URL:</label>
                <input type="url" id="target-url" placeholder="https://example.com" class="input-style" required>
            </div>

            <div class="mb-6">
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">পাসওয়ার্ড সেট করুন (এটি আপনার এনক্রিপশন কী):</label>
                <input type="password" id="password" placeholder="একটি শক্তিশালী পাসওয়ার্ড দিন" class="input-style" required>
            </div>

            <button id="create-btn" onclick="createSafelink()"
                    class="w-full py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition duration-150 shadow-lg active:bg-blue-800">
                সেফলিংক তৈরি করুন
            </button>

            <!-- Generated Link Output -->
            <div id="result-box" class="hidden mt-6 bg-gray-100 p-4 rounded-lg border border-dashed border-gray-300">
                <p class="text-sm font-medium text-gray-700 mb-2">আপনার সুরক্ষিত লিংক:</p>
                <input type="text" id="generated-link" readonly class="input-style bg-gray-50 text-blue-600 font-mono text-xs cursor-text select-all" onclick="this.select()">
                <button onclick="copyToClipboard('generated-link')" class="mt-2 w-full py-2 text-sm bg-green-500 text-white rounded-lg hover:bg-green-600 transition">
                    কপি করুন
                </button>
            </div>
        </div>

        <!-- Section 2: Link Unlocker & Countdown -->
        <div id="unlocker-section" class="hidden text-center">

            <div id="password-form">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">সুরক্ষিত লিংকটি আনলক করুন</h2>
                <p class="text-sm text-gray-500 mb-4">এই লিংকের ডেটা URL-এর মধ্যেই এনক্রিপ্ট করা আছে। সঠিক পাসওয়ার্ড দিন।</p>
                <div class="mb-6">
                    <label for="unlock-password" class="block text-sm font-medium text-gray-700 mb-2">পাসওয়ার্ড দিন:</label>
                    <input type="password" id="unlock-password" placeholder="পাসওয়ার্ড লিখুন" class="input-style" required>
                </div>
                <button id="unlock-btn" onclick="unlockLink()"
                        class="w-full py-3 bg-red-600 text-white font-bold rounded-lg hover:bg-red-700 transition duration-150 shadow-lg active:bg-red-800">
                    লিংক আনলক করুন
                </button>
            </div>

            <div id="countdown-display" class="hidden">
                <svg class="animate-spin h-10 w-10 text-blue-600 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="text-2xl font-bold text-blue-600 mb-2">লিংক খোলার প্রস্তুতি নিচ্ছে...</p>
                <p class="text-6xl font-extrabold text-gray-900" id="timer">10</p>
                <p class="text-lg text-gray-500 mt-2">রিডাইরেক্ট হওয়ার আগে ১০ সেকেন্ড অপেক্ষা করুন।</p>
            </div>
        </div>
    </div>

    <script>
        const ALGORITHM = 'AES-GCM';
        const SALT_LENGTH = 16;
        const IV_LENGTH = 12; // AES-GCM recommended IV length
        const ITERATIONS = 100000;
        const KEY_LENGTH = 256;

        // --- Utility Functions for ArrayBuffer <-> Base64URL ---

        /** Converts a Base64URL string to an ArrayBuffer. */
        function base64UrlToArrayBuffer(base64Url) {
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            // Pad to multiple of 4
            while (base64.length % 4) {
                base64 += '=';
            }
            const raw = window.atob(base64);
            const outputArray = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) {
                outputArray[i] = raw.charCodeAt(i);
            }
            return outputArray.buffer;
        }

        /** Converts an ArrayBuffer to a Base64URL string. */
        function arrayBufferToBase64Url(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const len = bytes.byteLength;
            for (let i = 0; i < len; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return window.btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        /** Utility: Display messages */
        function displayMessage(message, type = 'info') {
            const box = document.getElementById('message-box');
            let bgColor = 'bg-blue-100 border-blue-400 text-blue-700';
            if (type === 'error') bgColor = 'bg-red-100 border-red-400 text-red-700';
            if (type === 'success') bgColor = 'bg-green-100 border-green-400 text-green-700';
            
            box.className = `p-4 mb-4 rounded-lg text-sm font-medium text-center border ${bgColor}`;
            box.innerHTML = message;
            box.classList.remove('hidden');
        };

        function hideMessage() {
            document.getElementById('message-box').classList.add('hidden');
        };

        // --- CRYPTO FUNCTIONS ---

        /** Derives a cryptographic key from the password using PBKDF2. */
        async function getKeyFromPassword(password, salt) {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                'raw', 
                enc.encode(password), 
                { name: 'PBKDF2' }, 
                false, 
                ['deriveKey']
            );
            return crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: ITERATIONS,
                    hash: 'SHA-256',
                },
                keyMaterial,
                { name: ALGORITHM, length: KEY_LENGTH },
                true,
                ['encrypt', 'decrypt']
            );
        }

        // --- LINK CREATOR LOGIC ---

        window.createSafelink = async function() {
            const urlInput = document.getElementById('target-url');
            const passwordInput = document.getElementById('password');
            const resultBox = document.getElementById('result-box');
            const createBtn = document.getElementById('create-btn');
            
            hideMessage();

            const targetUrl = urlInput.value.trim();
            const password = passwordInput.value.trim();

            if (!targetUrl || !password) {
                displayMessage("দয়া করে লক্ষ্য URL এবং একটি পাসওয়ার্ড লিখুন।", 'error');
                return;
            }
            if (!urlInput.checkValidity()) {
                 displayMessage("একটি বৈধ URL লিখুন।", 'error');
                 return;
            }

            createBtn.disabled = true;
            createBtn.textContent = "এনক্রিপ্ট করা হচ্ছে...";

            try {
                // 1. Generate a random Salt and IV
                const salt = crypto.getRandomValues(new Uint8Array(SALT_LENGTH));
                const iv = crypto.getRandomValues(new Uint8Array(IV_LENGTH));
                
                // 2. Derive the key
                const key = await getKeyFromPassword(password, salt);
                
                // 3. Encrypt the URL
                const enc = new TextEncoder();
                const ciphertext = await crypto.subtle.encrypt(
                    { name: ALGORITHM, iv: iv },
                    key,
                    enc.encode(targetUrl)
                );

                // 4. Encode components for URL safety
                const encodedSalt = arrayBufferToBase64Url(salt.buffer);
                const encodedIV = arrayBufferToBase64Url(iv.buffer);
                const encodedData = arrayBufferToBase64Url(ciphertext);

                // 5. Generate the shareable link (using current page URL and encoded data)
                const baseUrl = window.location.origin + window.location.pathname;
                // Safelink format: ?s=[salt]&iv=[iv]&data=[ciphertext]
                const safeLink = `${baseUrl}?s=${encodedSalt}&iv=${encodedIV}&data=${encodedData}`;

                // 6. Display result
                document.getElementById('generated-link').value = safeLink;
                resultBox.classList.remove('hidden');
                displayMessage("সেফলিংক সফলভাবে তৈরি হয়েছে! এই লিংকটিই সুরক্ষিত ডেটা বহন করছে।", 'success');

            } catch (e) {
                console.error("Error creating safelink:", e);
                displayMessage(`লিংক তৈরি করতে ব্যর্থ: একটি সাধারণ বা শক্তিশালী পাসওয়ার্ড দিয়ে আবার চেষ্টা করুন।`, 'error');
            } finally {
                createBtn.disabled = false;
                createBtn.textContent = "সেফলিংক তৈরি করুন";
            }
        }

        // --- LINK UNLOCKER LOGIC ---

        let urlData = { salt: null, iv: null, data: null };

        /** Checks URL parameters and switches views. */
        function checkUrlForLink() {
            const urlParams = new URLSearchParams(window.location.search);
            urlData.salt = urlParams.get('s');
            urlData.iv = urlParams.get('iv');
            urlData.data = urlParams.get('data');

            if (urlData.salt && urlData.iv && urlData.data) {
                // Show Unlocker Section
                document.getElementById('creator-section').classList.add('hidden');
                document.getElementById('unlocker-section').classList.remove('hidden');
                hideMessage();
            } else {
                // Show Creator Section (Default)
                document.getElementById('creator-section').classList.remove('hidden');
                document.getElementById('unlocker-section').classList.add('hidden');
            }
        }

        window.unlockLink = async function() {
            const unlockPassword = document.getElementById('unlock-password').value.trim();
            const unlockBtn = document.getElementById('unlock-btn');
            
            if (!unlockPassword) {
                displayMessage("দয়া করে পাসওয়ার্ড লিখুন।", 'error');
                return;
            }
            
            unlockBtn.disabled = true;
            unlockBtn.textContent = "ডিক্রিপ্ট করা হচ্ছে...";
            hideMessage();

            try {
                // 1. Decode URL components
                const saltBuffer = base64UrlToArrayBuffer(urlData.salt);
                const ivBuffer = base64UrlToArrayBuffer(urlData.iv);
                const dataBuffer = base64UrlToArrayBuffer(urlData.data);

                // 2. Derive the key using the entered password
                const key = await getKeyFromPassword(unlockPassword, saltBuffer);

                // 3. Decrypt the data
                const decryptedBuffer = await crypto.subtle.decrypt(
                    { name: ALGORITHM, iv: ivBuffer },
                    key,
                    dataBuffer
                );

                // 4. Convert ArrayBuffer back to URL string
                const dec = new TextDecoder();
                const targetUrl = dec.decode(decryptedBuffer);

                // 5. Decryption successful: Start countdown
                displayMessage("পাসওয়ার্ড সঠিক! ১০ সেকেন্ড অপেক্ষা করুন...", 'success');
                document.getElementById('password-form').classList.add('hidden');
                document.getElementById('countdown-display').classList.remove('hidden');
                startCountdown(targetUrl);

            } catch (e) {
                // Decryption failure typically means the wrong key was used
                console.error("Decryption failed:", e);
                displayMessage("ভুল পাসওয়ার্ড। ডেটা ডিক্রিপ্ট করা সম্ভব হয়নি। আবার চেষ্টা করুন।", 'error');
                unlockBtn.disabled = false;
                unlockBtn.textContent = "লিংক আনলক করুন";
            }
        }

        // --- COUNTDOWN LOGIC ---
        function startCountdown(targetUrl) {
            let countdown = 10;
            const timerDisplay = document.getElementById('timer');
            
            timerDisplay.textContent = countdown;

            const interval = setInterval(() => {
                countdown--;
                timerDisplay.textContent = countdown;

                if (countdown <= 0) {
                    clearInterval(interval);
                    timerDisplay.textContent = '০';
                    displayMessage("রিডাইরেক্ট হচ্ছে...", 'success');
                    // Actual redirection
                    window.location.replace(targetUrl); // Replaces current history entry
                }
            }, 1000);
        }

        // --- CLIPBOARD UTILITY ---
        window.copyToClipboard = function(elementId) {
            const input = document.getElementById(elementId);
            input.select();
            input.setSelectionRange(0, 99999); // For mobile devices
            try {
                // Use execCommand('copy') for better iframe compatibility
                document.execCommand('copy'); 
                displayMessage("লিংক কপি করা হয়েছে!", 'success');
            } catch (err) {
                displayMessage("কপি করতে ব্যর্থ হয়েছেন। ম্যানুয়ালি কপি করুন।", 'error');
            }
        }

        // --- INITIALIZATION ---
        window.onload = checkUrlForLink;
        
    </script>
</body>
</html>
